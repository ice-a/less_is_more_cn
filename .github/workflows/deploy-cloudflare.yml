# 部署到 Cloudflare Pages（替代 GitHub Pages）
# 与 deploy.yml 二选一：启用本文件前，把 deploy.yml 的触发改成 workflow_dispatch。
#
# 需要的 Secrets / Variables：
#   CLOUDFLARE_API_TOKEN   —— Pages:Edit 权限的 API Token（Secret）
#   CLOUDFLARE_ACCOUNT_ID  —— Cloudflare 账号 ID（Secret）
#   CF_PAGES_PROJECT       —— Pages 项目名（Variable，默认 less-is-more-cn）
#   CF_SITE_URL            —— 自定义域名，如 https://blog.example.com（Variable，不填则用 *.pages.dev）
#   INDEXNOW_KEY           —— IndexNow 密钥（Secret）
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: cloudflare-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # 站点地址在这里定：自定义域名用根路径；挂在 <project>.pages.dev 时用 /
      - name: Build VitePress
        run: npm run docs:build
        env:
          CF_SITE_URL: ${{ vars.CF_SITE_URL || format('https://{0}.pages.dev', vars.CF_PAGES_PROJECT || 'less-is-more-cn') }}
          CF_SITE_BASE: ${{ vars.CF_SITE_BASE || '/' }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy content/.vitepress/dist --project-name ${{ vars.CF_PAGES_PROJECT || 'less-is-more-cn' }} --branch main --commit-dirty=true

      # 部署完成后把 sitemap 推给搜索引擎（单个渠道失败不影响部署结果）
      - name: Push URLs to search engines
        continue-on-error: true
        run: node scripts/seo-push.mjs content/.vitepress/dist
        env:
          SEO_HOST: ${{ vars.SEO_HOST || vars.CF_SITE_URL || format('{0}.pages.dev', vars.CF_PAGES_PROJECT || 'less-is-more-cn') }}
          SITE_PREFIX: ${{ vars.SITE_PREFIX || '/' }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          INDEXNOW_KEY_FILE: ${{ secrets.INDEXNOW_KEY_FILE }}
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          BAIDU_TOKEN: ${{ secrets.BAIDU_TOKEN }}
          BAIDU_SITE: ${{ vars.BAIDU_SITE }}
